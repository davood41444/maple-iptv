# Builds Maple IPTV for iPhone/iPad on a GitHub Mac (no Mac needed here). See docs/BUILDING.md.
#   - always: an unsigned .ipa (for AltStore/Sideloadly with a free Apple ID), as an artifact
#   - with "testflight" ticked and the App Store Connect secrets set: a signed build uploaded to TestFlight
name: iPhone app

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed build to TestFlight (needs the App Store secrets)
        type: boolean
        default: false
  # Automatically only when the iPhone code changes: a free account's Mac minutes are limited
  # (about 200 a month for private projects). Interface changes: run it by hand for a release.
  push:
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          pod install

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -workspace MapleIPTV.xcworkspace -scheme MapleIPTV -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MapleIPTV.app Payload/
          zip -qry MapleIPTV-unsigned.ipa Payload

      # Nothing here runs the app, so check what a launch needs: the interface files, every
      # framework the app loads at start, and the VLC player.
      - name: Check the app
        working-directory: ios
        run: |
          APP=Payload/MapleIPTV.app
          du -sh "$APP" MapleIPTV-unsigned.ipa
          ls "$APP" "$APP/Frameworks" 2>/dev/null || true
          plutil -p "$APP/Info.plist" | grep -E '"CFBundle(Identifier|ShortVersionString|Version)"'
          lipo -info "$APP/MapleIPTV"
          otool -L "$APP/MapleIPTV"
          test -f "$APP/web/index.html" || { echo "::error::web/index.html is not in the app"; exit 1; }
          for lib in $(otool -L "$APP/MapleIPTV" | awk 'NR>1 && $1 ~ /^@rpath\// {print $1}'); do
            test -e "$APP/Frameworks/${lib#@rpath/}" || { echo "::error::$lib is not in the app"; exit 1; }
          done
          if test -d "$APP/Frameworks/MobileVLCKit.framework"; then echo "VLC: embedded framework"
          elif strings "$APP/MapleIPTV" | grep -q VLCMediaPlayer; then echo "VLC: linked into the app"
          else echo "::error::the VLC player is not in the app"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: MapleIPTV-iPhone-unsigned
          path: ios/MapleIPTV-unsigned.ipa

      # Signed build for TestFlight / the App Store. Xcode creates the certificate and profile
      # itself with the App Store Connect API key ("cloud-managed signing").
      - name: TestFlight
        if: ${{ inputs.testflight }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$ASC_KEY_P8" -a -n "$TEAM_ID" || { echo "App Store secrets are not set (see docs/BUILDING.md)"; exit 1; }
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/key.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace MapleIPTV.xcworkspace -scheme MapleIPTV -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MapleIPTV.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM=$TEAM_ID $AUTH archive
          sed "s/TEAM_ID/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/MapleIPTV.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export $AUTH
